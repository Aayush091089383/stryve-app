name: stryve
description: "Stryve - the campus app for students and teachers (timetable, assignments, attendance)."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  intl: ^0.20.3
  http: ^1.6.0
  image_picker: ^1.1.2
  flutter_secure_storage: ^9.0.0
  flutter_dotenv: ^5.1.0
  provider: ^6.1.0
  file_selector: ^1.1.0
  http_parser: ^4.1.2
  pdfrx: ^2.6.5
  file_saver: ^0.7.0
  flutter_local_notifications: ^22.3.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
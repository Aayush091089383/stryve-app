name: stryve
description: "Stryve - the campus app for students and teachers (timetable, assignments, attendance)."
publish_to: 'none'

version: 1.0.3+4

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  intl: ^0.20.3
  http: ^1.6.0
  image_picker: ^1.1.2
  flutter_secure_storage: ^9.0.0
  flutter_dotenv: ^5.1.0
  provider: ^6.1.0
  file_selector: ^1.1.0
  http_parser: ^4.1.2
  pdfrx: ^2.6.5
  file_saver: ^0.7.0
  flutter_local_notifications: ^22.3.2
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  video_player: ^2.14.1
  chewie: ^1.8.5
  url_launcher: ^6.3.3
  # In-app update check against GitHub Releases.
  github_release_apk_updater: ^1.0.11
  package_info_plus: ^9.0.1

dependency_overrides:
  # The updater asks for package_info_plus ^10.2.1, which pulls win32 6.
  # flutter_secure_storage 9 (the stored session) still needs win32 5, so the
  # two cannot coexist. The updater only reads PackageInfo.version, whose API is
  # unchanged since v9; lifting this override means migrating secure storage to
  # v10 first (v11 cannot read v9 data without that migration).
  package_info_plus: ^9.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true